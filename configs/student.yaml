seed: 289
device: auto
torch_num_threads: 1

model:
  hidden_dim: 256
  num_layers: 3
  use_gru: false

training:
  batch_size: 256
  updates: 24000
  smoke_updates: 120
  train_sequence_length: 110
  learning_rate: 6.3e-4
  grad_clip_norm: 5.0
  eval_every: 1000
  smoke_eval_every: 20
  val_horizon: 300
  max_val_windows: 128
  checkpoint_metric: val/VPT80@0.25
  checkpoint_mode: max

loss:
  one_step_weight: 25
  rollout_weight: 1.0
  rollout_train_horizon: 20
  rollout_min_horizon: 5
  rollout_curriculum_updates: 3000
  rollout_discount: 0.95

eval:
  warmup_steps: 10
  horizon: auto
  max_horizon: 1000
  report_horizons: [1, 5, 10, 90, 100, 200, 500, 1000]
  vpt_thresholds: [0.10, 0.25, 0.50]
